<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Guide</title>
<!--@apps.css@-->
<style>
  /* Help now: what is happening, then what the sources say, in their own
     words. Nothing here is advice of ours; a situation is a name, an order
     and a list of quotations with where they came from. */
  .page { max-width: 720px; }
  .fg-head { margin: 4px 0 16px; }
  .fg-head h1 { margin: 0; font-size: 24px; line-height: 1.2; }
  .fg-disc { margin: 4px 0 0; font-size: 13px; color: var(--text2); }
  .fg-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .fg-print { flex: none; }

  .fg-group { margin: 0 0 22px; }
  .fg-group-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .fg-group-h i { font-style: normal; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .fg-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .fg-sit { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; border: 0; border-top: 1px solid var(--border); background: none; color: var(--text); font: inherit; font-size: 16px; text-align: start; cursor: pointer; }
  .fg-list li:first-child .fg-sit { border-top: 0; }
  .fg-sit:hover, .fg-sit:focus-visible { background: var(--amber-glow); outline: none; }
  .fg-sit .name { flex: 1; min-width: 0; }
  .fg-sit .mark { flex: none; min-width: 28px; height: 28px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--text2); }
  .fg-sit .mark.none { border-color: transparent; }
  .fg-sit .have { flex: none; width: 8px; height: 8px; border-radius: 4px; background: var(--green); }
  .fg-sit.empty .have { display: none; }

  .fg-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 4px 0 0; }
  .fg-link { border: 0; background: none; padding: 0 4px; min-height: 44px; color: var(--amber); font: inherit; font-size: 14px; cursor: pointer; }
  .chips .chip.tag { min-height: 44px; padding: 0 14px; font-size: 13px; }
  .fg-sky { margin: 0 0 14px; padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .fg-sky > div { display: flex; flex-wrap: wrap; gap: 0 10px; padding: 3px 0; }
  .fg-sky dt { flex: none; min-width: 7.5em; font-size: 13px; font-weight: 700; color: var(--text2); }
  .fg-sky dd { flex: 1; min-width: 12em; margin: 0; font-size: 15px; line-height: 1.4; }
  .fg-sky-place { margin: 6px 0 0; font-size: 12px; color: var(--text2); }
  .fg-also { align-self: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .fg-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 12px; }
  .fg-night { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--text2); cursor: pointer; }
  .fg-night input { width: 20px; height: 20px; accent-color: var(--amber); }

  .fg-h2 { margin: 22px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .fg-en { margin: 0 0 12px; font-size: 12.5px; color: var(--text2); }
  .fg-state { margin: 40px 0; text-align: center; color: var(--text2); }

  .fg-set { margin: 0 0 18px; }
  .fg-set .fg-row { display: flex; align-items: center; gap: 10px; cursor: default; }
  .fg-set .fg-row > div { flex: 1; min-width: 0; }
  .fg-set .ok { color: var(--green); font-size: 13px; white-space: nowrap; }
  .fg-bar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .fg-bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .4s linear; }

  /* "What's happening?": the first thing on the page, one tap from the answer */
  .fg-ask { margin: 0 0 18px; }
  .fg-ask input { width: 100%; min-height: 52px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; font-size: 17px; -webkit-appearance: none; appearance: none; }
  .fg-ask input::placeholder { color: var(--text2); }
  .fg-ask input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .fg-ask input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
  .fg-hits { margin-top: 8px; }
  .fg-hits:empty { display: none; }
  .fg-hit .name { font-weight: 600; }
  .fg-hit.lead { background: var(--amber-glow); }
  .fg-hit.lib .name { font-size: 15px; font-weight: 400; color: var(--text2); }
  @media (max-width: 480px) { .fg-head h1 { font-size: 22px; } }

  /* Paper: a situation prints as the quotations and where they came from,
     in black on white, a quotation to a page when it will not fit. */
  @media print {
    html, body { background: #fff !important; color: #000 !important; }
    .fg-print, .fg-tools, #c-related, #c-sky, .fg-night, .fg-actions, .fg-link, .fg-btn, #c-jump, .fg-lib, .fg-libgroup, #front, #library, .fg-no-print, .fg-h2.fg-no-print { display: none !important; }
    .page { max-width: none; padding: 0; }
    .fg-head h1 { font-size: 20pt; }
    .fg-disc { color: #000; font-size: 10pt; }
    .fg-q { margin-bottom: 10pt; }
    .fg-body p, .fg-body li { font-size: 11pt; }
  }
</style>
</head>
<body>
<div class="page">
  <div id="front">
    <header class="fg-head">
      <h1 id="t-title">Help now</h1>
      <p class="fg-disc" id="t-disc"></p>
    </header>
    <div class="fg-ask fg-no-print" id="t-ask" role="search">
      <input id="t-q" type="search" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false">
      <ul class="fg-list fg-hits" id="t-hits"></ul>
    </div>
    <div id="t-num"></div>
    <div id="groups"></div>
    <div class="fg-tools">
      <button type="button" class="fg-link" id="t-library"></button>
      <label class="fg-night"><input type="checkbox" class="night-box"><span class="night-label"></span></label>
      <button type="button" class="fg-link" id="t-printall"></button>
    </div>
  </div>

  <div id="card" hidden>
    <header class="fg-head">
      <div class="fg-top"><h1 id="c-title"></h1>
        <div class="fg-actions"><label class="fg-night"><input type="checkbox" class="night-box"><span class="night-label"></span></label>
        <button type="button" class="fg-btn fg-print" id="c-print"></button></div></div>
      <p class="fg-disc" id="c-disc"></p>
    </header>
    <div id="c-num"></div>
    <dl class="fg-sky" id="c-sky" hidden></dl>
    <p class="fg-en" id="c-en" hidden></p>
    <div class="chips" id="c-related" hidden></div>
    <div class="chips" id="c-jump" hidden></div>
    <div id="c-quotes"></div>
    <div id="c-lib" class="fg-no-print"></div>
    <h2 class="fg-h2 fg-no-print" id="c-more-h" hidden></h2>
    <div id="c-more" class="fg-no-print"></div>
    <h2 class="fg-h2 fg-no-print" id="c-add-h" hidden></h2>
    <div id="c-add" class="fg-no-print"></div>
  </div>

  <div id="library" hidden>
    <header class="fg-head"><h1 id="l-title"></h1><p class="fg-disc" id="l-disc"></p></header>
    <div id="l-sets"></div>
  </div>
  <p class="fg-state" id="state" hidden></p>
</div>
<!--@fieldguide-card.js@-->
<!--@apps.js@-->
<script>
var STR = strings({
  title: 'Field Guide', help_now: 'Help now', disclaimer: 'Not medical advice. Call emergency services if you can.',
  group_hurt: 'Someone is hurt', group_survive: 'Staying alive', group_disaster: 'A disaster',
  order_march: 'MARCH', print: 'Print', english_only: 'The sources are shown in English.',
  get_library: 'Get the library', library_note: 'The sources behind each situation, and how large they are.',
  red_night: 'Red night light', more_in_library: 'More in your library', add_to_library: 'Add to your library',
  installed: 'Installed', get_all: 'Get what is missing ({size})', started: 'Started', needs_admin: 'Sign in as an administrator to add ZIMs.',
  failed: 'That did not work. Try again.', loading: 'Loading…', building: 'Building…', built: 'Built', set_core: 'The core', set_more: 'Goes deeper',
  nothing: 'Nothing installed answers this yet.', confirm_big: 'This is {size}. Download it?', open: '', lang: 'en', lat: '',
  yes_download: 'Download', cancel: 'Cancel', print_all: 'Print every situation', your_library: 'Your library', see_also: 'See also',
  ask: 'What’s happening?', search_library: 'Search your library for “{q}”'
});
var LOCALE = STR.lang || 'en';
var CARD = FieldGuideCard;
CARD.ensureStyle(document);

function $(id) { return document.getElementById(id); }
function say(key, vars) { return CARD.word(STR, key, vars); }
function sit(id) { return STR['s_' + id] || id; }
var state = { view: 'front', id: '' };

// ── the shell's switch: red light at night, one key for the sky and this ──
function nightInit() {
  var boxes = document.querySelectorAll('.night-box');
  function sync() { var on = document.documentElement.classList.contains('night-red'); boxes.forEach(function(b) { b.checked = on; }); }
  document.querySelectorAll('.night-label').forEach(function(l) { l.textContent = say('red_night'); });
  boxes.forEach(function(b) { b.onchange = function() { nightSet(b.checked); sync(); tell({ zimi: 'night' }); }; });
  window.addEventListener('storage', sync);
  sync();
}

// ── the front ──
var home = null;
function showFront() {
  state = { view: 'front', id: '' };
  $('front').hidden = false; $('card').hidden = true; $('library').hidden = true; $('state').hidden = true;
  tell({ zimi: 'fieldguide-home' });
  tellTop();
  window.scrollTo(0, 0);
}
function drawFront() {
  drawNumber('t-num');
  $('t-title').textContent = say('help_now');
  $('t-q').placeholder = say('ask');
  $('t-q').setAttribute('aria-label', say('ask'));
  // A keyboard on a desk: type at once. On a phone the keyboard would hide the list, so no.
  if (window.matchMedia && matchMedia('(pointer: fine)').matches && state.view === 'front') $('t-q').focus({ preventScroll: true });
  $('t-disc').textContent = say('disclaimer');
  $('t-library').textContent = say('get_library');
  $('t-printall').textContent = say('print_all');
  $('groups').innerHTML = home.groups.map(function(g) {
    var order = g.order ? say('order_' + g.order) : '';
    return '<section class="fg-group"><h2 class="fg-group-h">' + esc(say('group_' + g.id)) + (order ? ' <i>' + esc(order) + '</i>' : '') + '</h2><ul class="fg-list">' +
      g.situations.map(function(s) {
        return '<li><button type="button" class="fg-sit' + (s.installed ? '' : ' empty') + '" data-id="' + esc(s.id) + '">' +
          '<span class="mark' + (s.mark ? '' : ' none') + '" aria-hidden="true">' + esc(s.mark) + '</span>' +
          '<span class="name">' + esc(sit(s.id)) + '</span><span class="have" aria-hidden="true"></span><span class="chev"></span></button></li>';
      }).join('') + '</ul></section>';
  }).join('');
}
$('groups').addEventListener('click', function(e) {
  var b = e.target.closest('.fg-sit');
  if (b) openSituation(b.getAttribute('data-id'), true);
});
$('t-library').onclick = function() { openLibrary(); };

// ── what's happening: the words go to the matcher search uses (/fieldguide/match),
// so the box and the search bar name the same situation; Enter opens it, or, when
// nothing is named, searches the library. A named baby leads with its passage. ──
var ASK_WAIT_MS = 120, askSeq = 0, askTimer = 0, askHit = null, askAsked = null;
function askRows(q) {
  var rows = askHit ? '<li><button type="button" class="fg-sit fg-hit lead" data-id="' + esc(askHit.id) + '"><span class="mark none" aria-hidden="true"></span>' +
    '<span class="name">' + esc(sit(askHit.id)) + '</span><span class="chev"></span></button></li>' : '';
  return rows + '<li><button type="button" class="fg-sit fg-hit lib" data-lib="1"><span class="mark none" aria-hidden="true"></span>' +
    '<span class="name">' + esc(say('search_library', { q: q })) + '</span><span class="chev"></span></button></li>';
}
function askDraw() {
  var q = $('t-q').value.trim();
  $('t-hits').innerHTML = q ? askRows(q) : '';
}
// The answer for what is in the box now, as a promise Enter can wait on.
function askLookup() {
  var q = $('t-q').value.trim(), mine = ++askSeq;
  askHit = null;
  askDraw();
  if (!q) return (askAsked = Promise.resolve());
  return (askAsked = fetch('/fieldguide/match?q=' + encodeURIComponent(q) + '&ui=' + encodeURIComponent(LOCALE)).then(function(r) { return r.ok ? r.json() : null; }).then(function(m) {
    if (mine !== askSeq) return;
    askHit = m && m.id ? m : null;
    askDraw();
  }).catch(function() {}));
}
function askGo(lib) {
  var q = $('t-q').value.trim();
  if (!q) return;
  if (askHit && !lib) openSituation(askHit.id, true, askHit.who);
  else tell({ zimi: 'search', q: q });
}
$('t-q').addEventListener('input', function() {
  clearTimeout(askTimer);
  askTimer = setTimeout(function() { askTimer = 0; askLookup(); }, ASK_WAIT_MS);
});
// Enter, read off the key: the reader's frame is sandboxed without forms, so no submit event.
$('t-q').addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();
  // Enter before the answer is back (or before it was asked): wait for it, then go.
  var waiting = !!askTimer;
  clearTimeout(askTimer); askTimer = 0;
  (waiting ? askLookup() : askAsked || Promise.resolve()).then(function() { askGo(false); });
});
$('t-hits').addEventListener('click', function(e) {
  var b = e.target.closest('.fg-hit');
  if (b) askGo(!!b.getAttribute('data-lib'));
});
$('t-printall').onclick = function() { printSheet(true); };

// ── one situation ──
var seq = 0;
// Where the reader is, for the emergency number and the sky: the time zone's country and
// middle (static/zone-places.js, static/fieldguide-numbers.json), read once. Either failing to
// load is not an error: the number then says 112 / 911 and the sky is left as the data has it.
var geo = null, geoWaiting = [];
function geoLoad(then) {
  if (geo) return then(geo);
  geoWaiting.push(then);
  if (geoWaiting.length > 1) return;
  function get(url) { return fetch(url).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }); }
  // The sky's own time zone table (the same file the Almanac reads): a script that defines the lookups.
  var zonesLoaded = new Promise(function(done) {
    var s = document.createElement('script');
    s.src = '/static/zone-places.js?v=45';
    s.onload = function() { done(typeof _skyZonePlace === 'function' ? { place: _skyZonePlace, country: _skyZoneCountry } : null); };
    s.onerror = function() { done(null); };
    document.head.appendChild(s);
  });
  Promise.all([zonesLoaded, get('/static/fieldguide-numbers.json?v=1')]).then(function(x) {
    var tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    geo = { zones: x[0], numbers: x[1], tz: tz };
    geoWaiting.splice(0).forEach(function(f) { f(geo); });
  });
}
function groupOf(id) {
  var g = ((home && home.groups) || []).filter(function(x) { return x.situations.some(function(s) { return s.id === id; }); })[0];
  return g ? g.id : '';
}
// The emergency number here: at the top of Help now and of every card for someone who is hurt.
function drawNumber(boxId, id) {
  var box = $(boxId);
  box.innerHTML = '';
  if (id && groupOf(id) !== 'hurt') return;
  geoLoad(function(g) {
    if (id ? state.id !== id : state.view !== 'front') return;
    box.innerHTML = CARD.emergencyHtml(CARD.emergencyFor(g.zones, g.numbers, g.tz), g.numbers, STR);
  });
}
// The latitude to read the sky for: the place chosen in the Almanac, else the time zone's.
function whereAmI(then) {
  geoLoad(function(g) { then(CARD.placeLat(STR.lat, g.zones, g.tz, STR.lon, STR.place)); });
}
function openSituation(id, step, who) {
  var mine = ++seq;
  state = { view: 'card', id: id };
  $('front').hidden = true; $('library').hidden = true; $('card').hidden = false;
  $('c-title').textContent = sit(id);
  $('c-disc').textContent = say('disclaimer');
  $('c-print').textContent = say('print');
  $('c-quotes').innerHTML = ''; $('c-lib').innerHTML = '';
  drawNumber('c-num', id);
  $('c-related').hidden = true; $('c-related').innerHTML = '';
  $('c-sky').hidden = true; $('c-sky').innerHTML = '';
  $('c-more').innerHTML = ''; $('c-add').innerHTML = ''; $('c-jump').hidden = true; $('c-more-h').hidden = true; $('c-add-h').hidden = true;
  $('c-en').hidden = LOCALE === 'en'; $('c-en').textContent = say('english_only');
  if (step) tell({ zimi: 'fieldguide-card', id: id, title: sit(id) });
  tellTop();
  window.scrollTo(0, 0);
  var got = fetch('/fieldguide/situation?id=' + encodeURIComponent(id) + '&lang=' + encodeURIComponent(LOCALE)).then(function(r) {
    if (!r.ok) throw new Error('status ' + r.status);
    return r.json();
  });
  got.then(function(s) {
    if (mine !== seq) return;
    // The quotes draw at once; a sky for the reader's hemisphere that the zone table then
    // reveals reorders them (only the situations with a sky in them).
    var chosen = parseFloat(STR.lat);
    if (who) { var lead = CARD.forWho(s.quotes, who); s.quotes = [lead].concat(s.quotes.filter(function(q) { return q !== lead; })); }
    paint(s, CARD.skyFirst(s.quotes, isFinite(chosen) ? chosen : null));
    if (s.sky) drawSky(mine);
    if (s.quotes.some(function(q) { return q.sky; }) && !isFinite(chosen)) {
      whereAmI(function(p) {
        if (mine !== seq || !p) return;
        var again = CARD.skyFirst(s.quotes, p.lat);
        if (again.some(function(q, i) { return q !== s.quotes[i]; })) paint(s, again);
      });
    }
  }).catch(function() {
    if (mine !== seq) return;
    $('c-quotes').innerHTML = '<p class="fg-state">' + esc(say('failed')) + '</p>';
  });
}
// The sky strip (Lost, Signal, Shelter, Flood, Cold): daylight left, the dark, the Moon, true north, from
// the Almanac's own functions in the shell, which loads them now, after the card is up. No shell (the page
// alone) or no modules (offline with a cold cache): no strip.
function drawSky(mine) {
  var shell = null;
  try { if (window.parent !== window && typeof window.parent.fieldguideSky === 'function') shell = window.parent; } catch (e) {}
  if (!shell) return;
  whereAmI(function(p) {
    if (!p || mine !== seq) return;
    shell.fieldguideSky(p, function(sky) {
      if (!sky || mine !== seq) return;
      var box = $('c-sky');
      box.innerHTML = sky.rows.map(function(r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') +
        '<p class="fg-sky-place' + (sky.guessed ? ' guess' : '') + '">' + esc(sky.place) + '</p>';
      box.hidden = false;
    });
  });
}
// The situations the sources pair with this one: See also, one chip each.
function drawRelated(ids) {
  var box = $('c-related');
  box.hidden = !ids.length;
  box.innerHTML = ids.length ? '<span class="fg-also">' + esc(say('see_also')) + '</span>' + ids.map(function(r) {
    return '<button type="button" class="chip tag" data-sit="' + esc(r) + '">' + esc(sit(r)) + '</button>';
  }).join('') : '';
}
$('c-related').addEventListener('click', function(e) {
  var b = e.target.closest('[data-sit]');
  if (b) openSituation(b.getAttribute('data-sit'), true);
});
function paint(s, quotes) {
  drawRelated(s.related || []);
  $('c-quotes').innerHTML = quotes.map(function(q) { return CARD.quoteHtml(q, STR); }).join('');
  $('c-lib').innerHTML = CARD.libraryGroupHtml(quotes, STR);
  drawJump(quotes);
  if (s.answers.length) { $('c-more-h').hidden = false; $('c-more-h').textContent = say('more_in_library'); $('c-more').innerHTML = CARD.answersHtml(s.answers, STR); }
  // A source the library block already offers is not offered twice.
  var offered = {};
  quotes.forEach(function(q) { ((q.library && q.library.options) || []).forEach(function(o) { offered[o.piece] = 1; }); });
  var rest = s.missing.filter(function(m) { return !offered[m.piece]; });
  if (rest.length) { $('c-add-h').hidden = false; $('c-add-h').textContent = say('add_to_library'); $('c-add').innerHTML = CARD.missingHtml(rest, STR); }
}

// ── print: the shell prints it (this page is a sandboxed frame, where
// window.print() is blocked), from a sheet this page builds. One handler, one
// print: a second tap while the first is on its way does nothing.
var printing = false;
function sheetHtml(html) {
  return '<div class="fg-sheet"><h1>' + esc(say('title')) + '</h1><p class="fg-disc">' + esc(say('disclaimer')) + '</p>' + html + '</div>';
}
function handOver(html) {
  window.__sheet = html;
  var inShell = false;
  try { inShell = window.parent !== window; } catch (e) {}
  if (inShell) tell({ zimi: 'print-sheet' });
  else { document.body.insertAdjacentHTML('beforeend', '<div id="sheet-only">' + html + '</div>'); window.print(); }
}
function printSheet(all) {
  if (printing) return;
  printing = true;
  setTimeout(function() { printing = false; }, 3000);
  if (!all) { handOver(sheetHtml('<h2>' + esc(sit(state.id)) + '</h2>' + $('c-quotes').innerHTML)); return; }
  fetch('/fieldguide/print?lang=' + encodeURIComponent(LOCALE)).then(function(r) { if (!r.ok) throw new Error('status ' + r.status); return r.json(); }).then(function(d) {
    handOver(sheetHtml('<div class="fg-sheet-all">' + d.situations.map(function(x) {
      return '<section class="fg-sheet-sit"><h2>' + esc(sit(x.id)) + '</h2>' + x.quotes.map(function(q) { return CARD.quoteHtml(q, STR); }).join('') + '</section>';
    }).join('') + '</div>'));
  }).catch(function() { printing = false; });
}
$('c-print').addEventListener('click', function() { printSheet(false); });

// A long situation: one chip per quotation, by the source's own heading, so the one
// that is wanted (the Southern Sky, Apply a Tourniquet) is a tap away, not a scroll.
var JUMP_FROM = 3;
function drawJump(quotes) {
  var box = $('c-jump');
  box.hidden = quotes.length < JUMP_FROM;
  box.innerHTML = box.hidden ? '' : quotes.map(function(q) {
    return '<button type="button" class="chip tag" data-jump="' + esc(q.id) + '">' + esc(q.heading) + '</button>';
  }).join('');
}
$('c-jump').addEventListener('click', function(e) {
  var b = e.target.closest('[data-jump]');
  var el = b && document.querySelector('[data-quote="' + b.getAttribute('data-jump') + '"]');
  if (el) el.scrollIntoView({ block: 'start', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
});

// ── what a tap on a quote's library line, a page row or a Get does ──
function act(name, el) {
  var d = el.dataset;
  if (name === 'open') tell({ zimi: 'open', zim: d.zim, path: d.path });
  else if (name === 'search') tell({ zimi: 'search-in', zim: d.zim, q: d.q });
  else if (name === 'get') getZims([{ url: d.url, size: Number(d.size) || 0 }], el);
  else if (name === 'build') buildManual(el);
}
CARD.wire($('card'), act);
CARD.wire($('library'), act);

// Downloads go through the shell's own machinery (the batch route that honours
// the download schedule and the sign-in a ZIM download needs).
function manageFetch(url, opts) {
  try { if (window.parent !== window && typeof window.parent.manageFetch === 'function') return window.parent.manageFetch(url, opts); } catch (e) {}
  return fetch(url, opts);
}
// More than this much in one tap asks first (here, in the page: a sandboxed
// frame cannot raise window.confirm): a manual library is gigabytes.
var BIG_DOWNLOAD = 1e9;
function askFirst(btn, size, go) {
  var box = document.createElement('div');
  box.className = 'fg-confirm';
  box.innerHTML = '<span>' + esc(say('confirm_big', { size: CARD.sizeText(size) })) + '</span>' +
    '<button type="button" class="fg-btn on" data-yes>' + esc(say('yes_download')) + '</button>' +
    '<button type="button" class="fg-btn" data-no>' + esc(say('cancel')) + '</button>';
  btn.hidden = true;
  btn.parentNode.insertBefore(box, btn.nextSibling);
  function close() { box.remove(); btn.hidden = false; }
  box.querySelector('[data-yes]').onclick = function() { close(); go(); };
  box.querySelector('[data-no]').onclick = close;
}
// What the server said, in its words, or ours when it said none.
function reason(r, d) {
  if (r.status === 401 || r.status === 403) return say('needs_admin');
  return (d && d.error) ? String(d.error) : say('failed');
}
function post(url, body) {
  return manageFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function(r) { return r.json().catch(function() { return {}; }).then(function(d) { return { r: r, d: d }; }); });
}
function getZims(items, btn) {
  items = items.filter(function(i) { return i.url; });
  if (!items.length) return;
  var total = items.reduce(function(n, i) { return n + (i.size || 0); }, 0);
  if (total > BIG_DOWNLOAD && !btn.dataset.sure) { askFirst(btn, total, function() { btn.dataset.sure = '1'; getZims(items, btn); }); return; }
  btn.disabled = true; btn.textContent = say('loading');
  post('/manage/download-batch', { urls: items.map(function(i) { return i.url; }), sizes: items.map(function(i) { return i.size; }) })
    .then(function(x) {
      if (!x.r.ok) { btn.disabled = false; btn.textContent = reason(x.r, x.d); return; }
      btn.textContent = say('started') + ' · ' + (x.d.started || 0);
    })
    .catch(function() { btn.disabled = false; btn.textContent = say('failed'); });
}
function buildManual(btn) {
  btn.disabled = true; btn.textContent = say('building');
  post('/manage/fieldmanual', {})
    .then(function(x) {
      if (!x.r.ok) { btn.disabled = false; btn.textContent = reason(x.r, x.d); return; }
      pollManual(btn);
    })
    .catch(function() { btn.disabled = false; btn.textContent = say('failed'); });
}
function pollManual(btn) {
  manageFetch('/manage/fieldmanual').then(function(r) { return r.json(); }).then(function(s) {
    if (s.state === 'running') { btn.textContent = say('building') + (s.total ? ' ' + s.done + '/' + s.total : ''); setTimeout(function() { pollManual(btn); }, 1500); }
    else if (s.state === 'done') btn.textContent = say('built');
    else { btn.disabled = false; btn.textContent = s.message ? String(s.message) : say('failed'); }
  }).catch(function() { btn.disabled = false; btn.textContent = say('failed'); });
}

// ── get the library ──
function openLibrary() {
  state = { view: 'library', id: '' };
  $('front').hidden = true; $('card').hidden = true; $('library').hidden = false;
  $('l-title').textContent = say('get_library'); $('l-disc').textContent = say('library_note');
  $('l-sets').innerHTML = '<p class="fg-state">' + esc(say('loading')) + '</p>';
  tellTop();
  window.scrollTo(0, 0);
  fetch('/fieldguide/library').then(function(r) { return r.json(); }).then(function(d) {
    $('l-sets').innerHTML = d.sets.map(function(s) {
      var rows = s.pieces.map(function(p) {
        var right = p.installed ? '<span class="ok">✓ ' + esc(say('installed')) + '</span>' :
          p.build ? '<button type="button" class="fg-btn" data-act="build" data-build="' + esc(p.build) + '">' + esc(CARD.word(STR, 'build')) + ' · ' + esc(CARD.sizeText(p.size_bytes)) + '</button>' :
          p.url ? '<button type="button" class="fg-btn" data-act="get" data-url="' + esc(p.url) + '" data-size="' + esc(p.size_bytes) + '">' + esc(CARD.word(STR, 'get')) + ' · ' + esc(CARD.sizeText(p.size_bytes)) + '</button>' : '';
        var note = p.note + (p.build ? ' · ' + CARD.word(STR, 'build_note', { size: '~' + CARD.sizeText(p.size_bytes), source: p.source || '' }) : '');
        return '<li class="fg-row"><div><b>' + esc(p.name) + '</b><span>' + esc(note) + '</span></div>' + right + '</li>';
      }).join('');
      var all = s.pieces.filter(function(p) { return !p.installed && p.url; });
      var allBtn = all.length > 1 ? '<button type="button" class="fg-btn on" data-all="' + esc(s.id) + '">' + esc(say('get_all', { size: CARD.sizeText(s.missing_bytes) })) + '</button>' : '';
      return '<section class="fg-set"><h2 class="fg-h2">' + esc(say('set_' + s.id)) + '</h2><ul class="fg-rows">' + rows + '</ul>' + allBtn + '</section>';
    }).join('');
    $('l-sets').querySelectorAll('[data-all]').forEach(function(b) {
      var set = d.sets.filter(function(s) { return s.id === b.getAttribute('data-all'); })[0];
      b.onclick = function() { getZims(set.pieces.filter(function(p) { return !p.installed && p.url; }).map(function(p) { return { url: p.url, size: p.size_bytes }; }), b); };
    });
  }).catch(function() { $('l-sets').innerHTML = '<p class="fg-state">' + esc(say('failed')) + '</p>'; });
}

// ── the shell steering the page ──
window.__top = function() { return state.view === 'front'; };
window.__back = function() {
  if (state.view === 'front') return false;
  showFront();
  return true;
};
window.__route = function(id) {
  if (id) openSituation(id, false); else { state = { view: 'front', id: '' }; $('front').hidden = false; $('card').hidden = true; $('library').hidden = true; tellTop(); }
};
window.__home = function() { window.__route(''); };

fetch('/fieldguide').then(function(r) { return r.json(); }).then(function(d) {
  home = d;
  drawFront();
  nightInit();
  if (STR.open) openSituation(STR.open, false);
}).catch(function() {
  $('state').hidden = false; $('state').textContent = say('failed');
});
</script>
</body>
</html>
