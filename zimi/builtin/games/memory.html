<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="memory.css">
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Memory</h1>
  <button class="ar-btn" id="mm-new" type="button">New game</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small>Moves</small><b id="mm-moves">0</b></div>
    <div class="pl-stat"><small>Pairs</small><b id="mm-pairs">0</b></div>
    <div class="pl-stat"><small>Best</small><b id="mm-best">-</b></div>
  </div>
  <p class="pl-msg" id="mm-players" aria-live="polite" hidden></p>
  <div class="mm-grid" id="mm-grid" role="group" aria-label="The cards"></div>
  <p class="pl-msg" id="mm-msg" role="status" aria-live="polite"></p>
  <p class="pl-help">Turn two cards over. If the pictures match, they stay up. Find every pair. Tap a card, or move with the arrow keys and press Enter.</p>
</main>

<div class="ar-sheet" id="mm-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="mm-sheet-title">
  <div class="ar-sheet-card">
    <h2 id="mm-sheet-title">Memory</h2>
    <p id="mm-sheet-text">Find the matching pairs.</p>
    <p class="pl-row"><span id="mm-set-label">Pictures</span><span class="pl-seg" id="mm-set" role="group" aria-labelledby="mm-set-label"></span></p>
    <p class="pl-row"><span id="mm-size-label">Cards</span><span class="pl-seg" id="mm-size" role="group" aria-labelledby="mm-size-label"></span></p>
    <p class="pl-row"><span id="mm-who-label">Players</span><span class="pl-seg" id="mm-who" role="group" aria-labelledby="mm-who-label"></span></p>
    <div id="mm-names"></div>
    <div class="ar-sheet-actions"><button class="ar-btn" id="mm-go" type="button" aria-pressed="true">Start</button></div>
  </div>
</div>
<script src="playkit.js"></script>
<script src="handoff.js"></script>
<script src="memory.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q20825866">About Memory</a></footer><!-- /zimi-about -->
</body>
</html>
