<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bricks - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<!-- zimi-shell --><script src="games-help.js"></script><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Bricks</h1>
  <button class="ar-btn" id="br-pause" type="button" disabled>Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small>Score</small><b id="br-score">0</b></div>
    <div class="pl-stat"><small>Level</small><b id="br-level">1</b></div>
    <div class="pl-stat"><small>Balls</small><b id="br-lives" role="img" aria-label="3 lives"></b></div>
    <div class="pl-stat"><small>Best</small><b id="br-best">0</b></div>
  </div>
  <canvas class="pl-canvas" id="br-board" role="img" aria-label="The wall, the ball and your paddle"></canvas>
  <p class="pl-msg" id="br-msg" role="status" aria-live="polite"></p>
  <p class="pl-help">Arrow keys or A and D move. Space launches. P pauses. On a phone, drag along the board and tap to launch.</p>
</main>

<div class="ar-sheet" id="br-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="br-sheet-title">
  <div class="ar-sheet-card">
    <h2 id="br-sheet-title">Bricks</h2>
    <p id="br-sheet-text"></p>
    <div class="ar-sheet-actions"><button class="ar-btn" id="br-go" type="button" aria-pressed="true">Start</button></div>
  </div>
</div>
<script src="playkit.js"></script>
<script src="bricks.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q177491">About Bricks</a></footer><!-- /zimi-about -->
</body>
</html>
