<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocks - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<!-- zimi-shell --><script src="games-help.js"></script><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Rocks</h1>
  <button class="ar-btn" id="rk-pause" type="button" disabled>Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small>Score</small><b id="rk-score">0</b></div>
    <div class="pl-stat"><small>Best</small><b id="rk-best">0</b></div>
    <div class="pl-stat"><small>Ships</small><b id="rk-lives">3</b></div>
    <div class="pl-stat"><small>Wave</small><b id="rk-wave">1</b></div>
  </div>
  <canvas class="pl-arena" id="rk-board" role="img" aria-label="Space: your ship, drifting rocks and the saucer"></canvas>
  <div class="pl-pad-row" role="group" aria-label="Controls">
    <button class="pl-key" id="rk-left" type="button" aria-label="Turn left">&#9664;</button>
    <button class="pl-key" id="rk-right" type="button" aria-label="Turn right">&#9654;</button>
    <button class="pl-key" id="rk-thrust" type="button" aria-label="Thrust">Thrust</button>
    <button class="pl-key" id="rk-fire" type="button" aria-label="Fire">Fire</button>
  </div>
  <p class="pl-msg" id="rk-msg" role="status" aria-live="polite"></p>
  <p class="pl-help">Arrow keys or A, D turn; Up or W thrusts; Space fires; P pauses. Shoot the rocks and they split. Everything wraps around the edges, saucers shoot back, and a new ship every 10,000 points.</p>
</main>

<div class="ar-sheet" id="rk-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="rk-sheet-title">
  <div class="ar-sheet-card">
    <h2 id="rk-sheet-title">Rocks</h2>
    <p id="rk-sheet-text"></p>
    <div class="ar-sheet-actions"><button class="ar-btn" id="rk-go" type="button" aria-pressed="true">Start</button></div>
  </div>
</div>
<script src="playkit.js"></script>
<script src="rocks.js"></script>
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q748890">About Rocks</a></footer><!-- /zimi-about -->
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
</body>
</html>
