<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where in the World - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="whereintheworld.css">
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Where in the World</h1>
  <button class="ar-btn" id="wm-mode" type="button" hidden title="Ask about built-in places or the places of your offline maps">World</button>
  <span class="ar-stat" id="wm-score" aria-live="polite">0 points</span>
</header>

<main class="pl-main wm-main">
  <p class="wm-n" id="wm-n"></p>
  <div class="wm-q">
    <h2 id="wm-ask">&nbsp;</h2>
    <p id="wm-kind"></p>
  </div>
  <div class="wm-frame" id="wm-frame" tabindex="0" role="application" aria-label="World map. Arrow keys move the pin, plus and minus zoom, Enter guesses.">
    <svg id="wm-svg" class="wm-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 400"></svg>
    <div class="wm-zoom">
      <button class="ar-btn" id="wm-zin" type="button" aria-label="Zoom in">+</button>
      <button class="ar-btn" id="wm-zout" type="button" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <p class="pl-msg" id="wm-msg" role="status" aria-live="polite"></p>
  <div class="pl-keys">
    <button class="ar-btn gm-play" id="wm-guess" type="button" disabled>Guess</button>
    <button class="ar-btn gm-play" id="wm-next" type="button" hidden>Next</button>
  </div>
  <p class="wm-info" id="wm-info" hidden></p>
  <p class="pl-help gl-source" id="wm-source"></p>
</main>

<div class="ar-sheet" id="wm-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="wm-sheet-title">
  <div class="ar-sheet-card">
    <h2 id="wm-sheet-title">Done</h2>
    <p id="wm-sheet-text"></p>
    <div class="ar-sheet-actions">
      <button class="ar-btn" id="wm-again" type="button">Another round</button>
      <button class="ar-btn" id="wm-close" type="button" aria-pressed="true">Close</button>
    </div>
  </div>
</div>
<script src="playkit.js"></script>
<script src="librarykit.js"></script>
<script src="world-land.js"></script>
<script src="whereintheworld-data.js"></script>
<script src="whereintheworld.js"></script>
<!-- zimi-about --><!-- /zimi-about -->
</body>
</html>
