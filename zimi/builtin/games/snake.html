<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Snake</h1>
  <button class="ar-btn" id="sn-pause" type="button" disabled>Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small>Apples</small><b id="sn-score">0</b></div>
    <div class="pl-stat"><small>Best</small><b id="sn-best">0</b></div>
  </div>
  <canvas class="pl-canvas" id="sn-board" role="img" aria-label="The board"></canvas>
  <p class="pl-msg" id="sn-msg" role="status" aria-live="polite"></p>
  <p class="pl-help">Arrow keys or WASD steer. Space pauses. On a phone, swipe on the board. It speeds up with every apple.</p>
</main>

<div class="ar-sheet" id="sn-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sn-sheet-title">
  <div class="ar-sheet-card">
    <h2 id="sn-sheet-title">Snake</h2>
    <p id="sn-sheet-text"></p>
    <button class="ar-btn" id="sn-wrap" type="button" aria-pressed="false" title="Edges lead to the opposite side">Wrap around the edges</button>
    <div class="ar-sheet-actions"><button class="ar-btn" id="sn-go" type="button" aria-pressed="true">Start</button></div>
  </div>
</div>
<script src="playkit.js"></script>
<script src="snake.js"></script>
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q125177944">About Snake</a></footer><!-- /zimi-about -->
</body>
</html>
